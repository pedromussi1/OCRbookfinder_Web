name: Sync to Hugging Face Space

# Auto-deploys the app to https://huggingface.co/spaces/Zao0531/ocr-bookfinder
# on every push to main that touches app code. Uploads only the app files (leaving the
# Space's own README, which holds the HF config, untouched). Requires an HF write token
# stored as the repo secret HF_TOKEN.

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "bookfinder/**"
      - "templates/**"
      - "Dockerfile"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face CLI
        run: pip install --upgrade "huggingface_hub[cli]"

      - name: Stage app files
        run: |
          mkdir -p _hf
          cp app.py requirements.txt Dockerfile _hf/
          cp -r bookfinder templates _hf/

      - name: Upload to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >
          hf upload Zao0531/ocr-bookfinder _hf . --repo-type space
          --token "$HF_TOKEN"
          --commit-message "Sync from GitHub @ ${{ github.sha }}"

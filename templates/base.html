<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OCR BookFinder{% endblock %}</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --card: #ffffff;
            --text: #1b1f24;
            --muted: #5b6470;
            --border: #e3e6ea;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --accent-soft: #eef0fe;
            --shadow: 0 10px 30px rgba(20, 24, 40, 0.08);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e1116;
                --card: #171b22;
                --text: #e6e9ef;
                --muted: #9aa4b2;
                --border: #262b34;
                --accent: #7c83ff;
                --accent-hover: #9aa0ff;
                --accent-soft: #1c2030;
                --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .wrap { width: 100%; max-width: 640px; margin: 0 auto; padding: 32px 20px 48px; flex: 1; }
        header.site { text-align: center; margin-bottom: 28px; }
        header.site .logo { font-size: 40px; line-height: 1; }
        header.site h1 { margin: 10px 0 4px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
        header.site p { margin: 0; color: var(--muted); font-size: 15px; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 26px;
        }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 20px; border: none; border-radius: 10px;
            background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
            cursor: pointer; text-decoration: none; transition: background .15s ease;
            width: 100%;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:disabled { opacity: .6; cursor: default; }
        .btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--border); }
        .btn.secondary:hover { background: var(--accent-soft); }
        .muted { color: var(--muted); font-size: 14px; }
        .error { background: #fdecea; color: #8a1c1c; border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; }
        @media (prefers-color-scheme: dark) { .error { background: #3a1d1d; color: #ffb4b4; } }
        footer.site { text-align: center; color: var(--muted); font-size: 13px; padding: 16px; }
        footer.site a { color: var(--muted); }
        .spinner {
            width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.4);
            border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="wrap">
        <header class="site">
            <div class="logo">📚</div>
            <h1>OCR BookFinder</h1>
            <p>Snap a book cover or page — find out what book it is.</p>
        </header>
        {% block content %}{% endblock %}
    </div>
    <footer class="site">
        Powered by Tesseract OCR + Open Library ·
        <a href="https://github.com/pedromussi1/OCRbookfinder_Web">source</a>
    </footer>
</body>
</html>
